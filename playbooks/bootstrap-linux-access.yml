---
- name: Déployer les accès administratifs Linux nominatifs EduSmart
  hosts: "{{ target_hosts | default('ansible_controllers:linux_servers') }}"
  become: true
  gather_facts: false

  vars:
    linux_admin_group: eds_admins

    linux_admin_users:
      - name: r.sibbille
        comment: Ruben Sibbille - Administrateur Linux EduSmart
        public_keys:
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/authorized_keys/r.sibbille.pub') }}"

      - name: p.feret
        comment: Pierre Feret - Administrateur Linux EduSmart
        public_keys:
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/authorized_keys/p.feret.pub') }}"

      - name: n.sokri
        comment: Nesly Sokri - Administrateur Linux EduSmart
        public_keys:
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/authorized_keys/n.sokri.pub') }}"

      - name: s.mousset
        comment: Sacha Mousset - Administrateur Linux EduSmart
        public_keys:
          - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/authorized_keys/s.mousset.pub') }}"

  tasks:
    - name: Créer le groupe des administrateurs Linux EduSmart
      ansible.builtin.group:
        name: "{{ linux_admin_group }}"
        state: present

    - name: Créer les comptes administrateurs nominatifs
      ansible.builtin.user:
        name: "{{ item.name }}"
        comment: "{{ item.comment }}"
        shell: /bin/bash
        create_home: true
        groups:
          - "{{ linux_admin_group }}"
        append: true
        password_lock: true
        state: present
      loop: "{{ linux_admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Déployer la clé SSH propre à chaque administrateur
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.public_keys | join('\n') }}"
        state: present
        manage_dir: true
        exclusive: true
      loop: "{{ linux_admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Autoriser le groupe EduSmart à utiliser sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ linux_admin_group }}"
        owner: root
        group: root
        mode: "0440"
        content: |
          %{{ linux_admin_group }} ALL=(ALL:ALL) NOPASSWD: ALL
        validate: "/usr/sbin/visudo -cf %s"

    - name: Vérifier les comptes administrateurs
      ansible.builtin.command:
        cmd: "id {{ item.name }}"
      loop: "{{ linux_admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

    - name: Vérifier les privilèges sudo
      ansible.builtin.command:
        cmd: "sudo -l -U {{ item.name }}"
      loop: "{{ linux_admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false
