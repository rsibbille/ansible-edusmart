---
- name: Déployer les accès administratifs Linux EduSmart
  hosts: "{{ target_hosts | default('ansible_controllers:linux_servers') }}"
  become: true
  gather_facts: false

  vars:
    linux_admin_group: eds_admins
    linux_admin_user: eds_admin

    linux_admin_public_keys:
      - "{{ lookup('ansible.builtin.file', playbook_dir + '/../files/authorized_keys/eds_admin.pub') }}"

  tasks:
    - name: Créer le groupe des administrateurs Linux EduSmart
      ansible.builtin.group:
        name: "{{ linux_admin_group }}"
        state: present

    - name: Créer le compte administrateur EduSmart
      ansible.builtin.user:
        name: "{{ linux_admin_user }}"
        comment: Administrateur Linux EduSmart
        shell: /bin/bash
        create_home: true
        groups:
          - "{{ linux_admin_group }}"
        append: true
        password_lock: true
        state: present

    - name: Déployer les clés SSH administratives autorisées
      ansible.posix.authorized_key:
        user: "{{ linux_admin_user }}"
        key: "{{ linux_admin_public_keys | join('\n') }}"
        state: present
        manage_dir: true
        exclusive: true

    - name: Autoriser le groupe EduSmart à utiliser sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ linux_admin_group }}"
        owner: root
        group: root
        mode: "0440"
        content: |
          %{{ linux_admin_group }} ALL=(ALL:ALL) NOPASSWD: ALL
        validate: "/usr/sbin/visudo -cf %s"

    - name: Vérifier que le compte administrateur existe
      ansible.builtin.command:
        cmd: "id {{ linux_admin_user }}"
      changed_when: false

    - name: Vérifier les privilèges sudo du compte administrateur
      ansible.builtin.command:
        cmd: "sudo -l -U {{ linux_admin_user }}"
      changed_when: false
