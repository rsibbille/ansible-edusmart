---
- name: Durcir progressivement le service SSH
  hosts: ansible_controllers
  become: true
  gather_facts: false

  tasks:
    - name: Installer la configuration de durcissement SSH
      ansible.builtin.blockinfile:
        path: /etc/ssh/sshd_config
        insertbefore: BOF
        marker: "# {mark} ANSIBLE MANAGED BLOCK - EDUSMART SSH"
        backup: true
        block: |
          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PermitEmptyPasswords no
          MaxAuthTries 3
          LoginGraceTime 30
          X11Forwarding no
          AllowAgentForwarding no
          AllowTcpForwarding no
          PermitTunnel no
          ClientAliveInterval 300
          ClientAliveCountMax 2
          AllowUsers rsibbille eds_admin svc_ansible
        validate: "/usr/sbin/sshd -t -f %s"
      notify: Recharger SSH

  handlers:
    - name: Recharger SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
