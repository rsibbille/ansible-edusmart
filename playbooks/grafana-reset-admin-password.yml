---
- name: Réinitialiser le mot de passe administrateur Grafana
  hosts: docker_hosts
  become: true
  gather_facts: false

  tasks:
    - name: Réinitialiser eds_admin avec la valeur du Vault
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - grafana
          - grafana
          - cli
          - --homepath
          - /usr/share/grafana
          - --config
          - /etc/grafana/grafana.ini
          - admin
          - reset-admin-password
          - "{{ vault_grafana_admin_password }}"
      no_log: true
      changed_when: true
