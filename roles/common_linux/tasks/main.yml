---
- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les outils du socle Linux
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Configurer le fuseau horaire
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Créer le répertoire des journaux persistants
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  notify: Redémarrer journald

- name: Créer le répertoire de configuration journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configurer la journalisation persistante
  ansible.builtin.template:
    src: journald-edusmart.conf.j2
    dest: /etc/systemd/journald.conf.d/99-edusmart.conf
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer journald

- name: Vérifier qu'une source NTP interne est définie
  ansible.builtin.assert:
    that:
      - common_chrony_servers | length > 0
    fail_msg: >-
      common_enable_chrony est activé, mais aucune source n'est définie
      dans common_chrony_servers.
  when: common_enable_chrony | bool

- name: S'assurer que le répertoire de configuration Chrony existe
  ansible.builtin.file:
    path: /etc/chrony/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: common_enable_chrony | bool

- name: Activer le répertoire de configuration Chrony
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^\s*confdir\s+/etc/chrony/conf\.d\s*$'
    line: "confdir /etc/chrony/conf.d"
    state: present
  notify: Redémarrer Chrony
  when: common_enable_chrony | bool

- name: Retirer les sources NTP publiques de la configuration principale
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^\s*(pool|server)\s+'
    state: absent
  notify: Redémarrer Chrony
  when: common_enable_chrony | bool

- name: Configurer les sources NTP internes EduSmart
  ansible.builtin.template:
    src: chrony-edusmart.conf.j2
    dest: /etc/chrony/conf.d/99-edusmart.conf
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer Chrony
  when: common_enable_chrony | bool

- name: Activer Chrony
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started
  when:
    - common_enable_chrony | bool
    - not ansible_check_mode

- name: Désactiver Chrony lorsque non requis
  ansible.builtin.systemd_service:
    name: chrony
    enabled: false
    state: stopped
  when:
    - not common_enable_chrony | bool
    - not ansible_check_mode
  failed_when: false

- name: Effacer l'état d'échec Chrony
  ansible.builtin.command:
    cmd: systemctl reset-failed chrony.service
  changed_when: false
  failed_when: false
  when:
    - not common_enable_chrony | bool
    - not ansible_check_mode

- name: Activer rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Activer QEMU Guest Agent
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - common_enable_qemu_guest_agent
    - not ansible_check_mode

- name: Déployer la bannière EduSmart
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
