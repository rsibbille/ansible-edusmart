---
- name: Installer systemd-resolved et les outils DNS
  ansible.builtin.apt:
    name:
      - systemd-resolved
      - dnsutils
    state: present
    update_cache: true

- name: Déployer la configuration DNS permanente
  ansible.builtin.template:
    src: resolved.conf.j2
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer systemd-resolved

- name: Activer systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    enabled: true
    state: started

- name: Utiliser le fichier resolv.conf géré par systemd-resolved
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Appliquer immédiatement les changements DNS
  ansible.builtin.meta: flush_handlers

- name: Vérifier la résolution de Teleport
  ansible.builtin.command:
    cmd: getent hosts teleport.edusmart.lan
  register: dns_client_teleport_resolution
  changed_when: false
  failed_when:
    - dns_client_teleport_resolution.rc != 0
    - "'10.10.30.21' not in dns_client_teleport_resolution.stdout"
