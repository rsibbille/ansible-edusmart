---
- name: Vérifier le secret de configuration LAM
  ansible.builtin.assert:
    that:
      - vault_lam_config_password is defined
      - vault_lam_config_password | length >= 8
    fail_msg: >-
      vault_lam_config_password doit être défini dans le Vault
      du groupe docker_hosts.
  no_log: true

- name: Créer les répertoires LAM
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ lam_stack_path }}"
    - "{{ lam_stack_path }}/certificates"

- name: Vérifier le réseau partagé Nginx Proxy Manager
  ansible.builtin.command:
    cmd: "docker network inspect {{ lam_proxy_network }}"
  register: lam_proxy_network_status
  changed_when: false
  failed_when: false

- name: Créer le réseau partagé Nginx Proxy Manager
  ansible.builtin.command:
    cmd: "docker network create {{ lam_proxy_network }}"
  when: lam_proxy_network_status.rc != 0

- name: Installer la CA EduSmart pour LAM
  ansible.builtin.copy:
    src: edusmart-root-ca.crt
    dest: "{{ lam_stack_path }}/certificates/edusmart-root-ca.crt"
    owner: root
    group: root
    mode: "0644"

- name: Déployer la configuration LDAP du conteneur
  ansible.builtin.template:
    src: ldap.conf.j2
    dest: "{{ lam_stack_path }}/ldap.conf"
    owner: root
    group: root
    mode: "0644"

- name: Déployer le fichier Compose LAM
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ lam_stack_path }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Déployer le secret LAM
  ansible.builtin.copy:
    dest: "{{ lam_stack_path }}/.env"
    owner: root
    group: root
    mode: "0600"
    content: |
      LAM_CONFIG_PASSWORD={{ vault_lam_config_password }}
  no_log: true

- name: Valider la configuration Compose LAM
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f compose.yml config --quiet
    chdir: "{{ lam_stack_path }}"
  changed_when: false

- name: Démarrer LDAP Account Manager
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f compose.yml up -d --remove-orphans
    chdir: "{{ lam_stack_path }}"
  register: lam_compose
  changed_when: >-
    'Created' in lam_compose.stderr or
    'Recreated' in lam_compose.stderr or
    'Started' in lam_compose.stderr or
    'Pulled' in lam_compose.stderr

- name: Attendre l'interface LAM
  ansible.builtin.uri:
    url: "http://{{ lam_bind_ip }}:{{ lam_bind_port }}/lam/"
    status_code: 200
    validate_certs: false
  register: lam_health
  retries: 30
  delay: 5
  until: lam_health.status == 200

- name: Vérifier la validation LDAPS depuis le conteneur
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ lam_container_name }}"
      - openssl
      - s_client
      - -connect
      - srv-prd-par-idm-001.edusmart.lan:636
      - -servername
      - srv-prd-par-idm-001.edusmart.lan
      - -CAfile
      - /etc/ssl/certs/edusmart-root-ca.crt
  register: lam_ldaps_test
  changed_when: false
  failed_when: >
    'Verify return code: 0 (ok)' not in
    (lam_ldaps_test.stdout ~ lam_ldaps_test.stderr)


- name: Valider le profil utilisateur LAM versionné
  ansible.builtin.assert:
    that:
      - >-
        'inetOrgPerson_mail: $user@edusmart.lan'
        in lookup(
          'ansible.builtin.file',
          role_path + '/files/profiles/default.user'
        )
      - >-
        'posixAccount_homeDirectory: /home/$user'
        in lookup(
          'ansible.builtin.file',
          role_path + '/files/profiles/default.user'
        )
    fail_msg: >-
      Le profil LAM versionné ne contient pas les valeurs automatiques
      attendues pour l'adresse mail ou le répertoire personnel.

- name: Déployer le profil utilisateur LAM sur l'hôte Docker
  ansible.builtin.copy:
    src: profiles/default.user
    dest: "{{ lam_stack_path }}/default.user"
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Installer le profil utilisateur par défaut dans LAM
  ansible.builtin.shell: |
    set -euo pipefail

    container="{{ lam_container_name }}"
    source_file="{{ lam_stack_path }}/default.user"
    target_directory="/var/lib/ldap-account-manager/config/profiles/{{ lam_server_profile }}"
    target_file="${target_directory}/default.user"
    backup_file="${target_file}.ansible-backup"

    docker exec "$container" mkdir -p "$target_directory"

    source_sha="$(sha256sum "$source_file" | awk '{print $1}')"
    target_sha="$(
      docker exec "$container" sha256sum "$target_file" 2>/dev/null |
      awk '{print $1}' || true
    )"

    if [ "$source_sha" = "$target_sha" ]; then
      echo "PROFILE_OK"
      exit 0
    fi

    metadata="$(
      docker exec "$container" stat -c '%u:%g:%a' "$target_file" 2>/dev/null ||
      echo '33:33:640'
    )"

    if docker exec "$container" test -f "$target_file"; then
      docker exec "$container" cp -a "$target_file" "$backup_file"
    fi

    docker cp "$source_file" "$container:$target_file"

    owner_uid="${metadata%%:*}"
    remaining="${metadata#*:}"
    owner_gid="${remaining%%:*}"
    file_mode="${remaining##*:}"

    docker exec "$container" chown "$owner_uid:$owner_gid" "$target_file"
    docker exec "$container" chmod "$file_mode" "$target_file"

    echo "PROFILE_UPDATED"
  args:
    executable: /bin/bash
  register: lam_default_profile_install
  changed_when: "'PROFILE_UPDATED' in lam_default_profile_install.stdout"
  when: not ansible_check_mode

- name: Afficher l'état de LAM
  ansible.builtin.command:
    cmd: docker compose --env-file .env -f compose.yml ps
    chdir: "{{ lam_stack_path }}"
  register: lam_status
  changed_when: false

- name: Résultat du déploiement LAM
  ansible.builtin.debug:
    var: lam_status.stdout_lines
