---
- name: Installer BIND9 et ses outils
  ansible.builtin.apt:
    name: "{{ bind9_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le répertoire des zones primaires
  ansible.builtin.file:
    path: /etc/bind/zones
    state: directory
    owner: root
    group: bind
    mode: "0750"
  when: idm_role == "primary"

- name: Déployer la zone directe primaire
  ansible.builtin.template:
    src: db.forward.j2
    dest: "/etc/bind/zones/db.{{ dns_domain }}"
    owner: root
    group: bind
    mode: "0640"
    validate: "/usr/bin/named-checkzone {{ dns_domain }} %s"
  when: idm_role == "primary"
  notify: Redémarrer BIND9

- name: Déployer la zone inverse primaire
  ansible.builtin.template:
    src: db.reverse.j2
    dest: /etc/bind/zones/db.10.10.20
    owner: root
    group: bind
    mode: "0640"
    validate: "/usr/bin/named-checkzone {{ dns_reverse_zone }} %s"
  when: idm_role == "primary"
  notify: Redémarrer BIND9

- name: Déployer les options BIND9
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0640"
    validate: "/usr/bin/named-checkconf %s"
  notify: Redémarrer BIND9

- name: Déclarer les zones BIND9
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  notify: Redémarrer BIND9

- name: Vérifier la configuration BIND9 complète
  ansible.builtin.command:
    cmd: /usr/bin/named-checkconf -z /etc/bind/named.conf
  changed_when: false
  when: not ansible_check_mode

- name: Activer BIND9
  ansible.builtin.systemd_service:
    name: "{{ bind9_service_name }}"
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Appliquer les handlers BIND9
  ansible.builtin.meta: flush_handlers
