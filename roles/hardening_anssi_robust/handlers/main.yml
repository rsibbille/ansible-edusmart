---
- name: Appliquer les paramètres sysctl ANSSI
  ansible.builtin.command:
    cmd: /usr/sbin/sysctl --system
  changed_when: true

- name: Redémarrer auditd
  ansible.builtin.command:
    cmd: /usr/sbin/service auditd restart
  changed_when: true

- name: Recharger les règles auditd ANSSI
  ansible.builtin.command:
    cmd: /sbin/augenrules --load
  changed_when: true

- name: Redémarrer journald
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

- name: Recharger AppArmor
  ansible.builtin.systemd_service:
    name: apparmor.service
    state: reloaded
