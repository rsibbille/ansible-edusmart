---
- name: Vérifier les variables du certificat
  ansible.builtin.assert:
    that:
      - pki_server_common_name is defined
      - pki_server_subject_alt_names is defined
      - pki_server_subject_alt_names | length >= 2
      - pki_server_verify_names is defined
      - vault_pki_ca_passphrase is defined
    fail_msg: "Les variables PKI du serveur sont incomplètes."
  no_log: true

- name: Vérifier la présence du certificat de la CA
  ansible.builtin.stat:
    path: "{{ pki_local_ca_certificate_path }}"
  delegate_to: localhost
  become: false
  register: pki_ca_certificate_stat

- name: Vérifier la présence de la clé privée de la CA
  ansible.builtin.stat:
    path: "{{ pki_local_ca_private_key_path }}"
  delegate_to: localhost
  become: false
  register: pki_ca_private_key_stat

- name: Refuser de continuer si la CA est absente
  ansible.builtin.assert:
    that:
      - pki_ca_certificate_stat.stat.exists
      - pki_ca_private_key_stat.stat.exists
    fail_msg: "Le certificat ou la clé privée de la CA EduSmart est absent."

- name: Installer les dépendances cryptographiques
  ansible.builtin.apt:
    name:
      - openssl
      - python3-cryptography
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Créer le répertoire TLS LDAP
  ansible.builtin.file:
    path: "{{ pki_server_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Générer la clé privée LDAP sur le serveur
  community.crypto.openssl_privatekey:
    path: "{{ pki_server_private_key_path }}"
    type: RSA
    size: "{{ pki_server_key_size }}"
    owner: root
    group: root
    mode: "0600"
    regenerate: never

- name: Générer le CSR LDAP en mémoire
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_server_private_key_path }}"
    common_name: "{{ pki_server_common_name }}"
    country_name: "{{ pki_server_country }}"
    organization_name: "{{ pki_server_organization }}"
    organizational_unit_name: "{{ pki_server_organizational_unit }}"
    subject_alt_name: "{{ pki_server_subject_alt_names }}"
    use_common_name_for_san: false
    key_usage:
      - digitalSignature
      - keyEncipherment
    key_usage_critical: true
    extended_key_usage:
      - serverAuth
  register: pki_server_csr
  changed_when: false

- name: Vérifier si un certificat existe déjà
  ansible.builtin.stat:
    path: "{{ pki_server_certificate_path }}"
  register: pki_server_certificate_stat

- name: Lire le certificat existant
  ansible.builtin.slurp:
    src: "{{ pki_server_certificate_path }}"
  when: pki_server_certificate_stat.stat.exists
  register: pki_existing_server_certificate

- name: Signer le certificat avec la CA EduSmart
  community.crypto.x509_certificate_pipe:
    content: >-
      {{
        (pki_existing_server_certificate.content | b64decode)
        if pki_server_certificate_stat.stat.exists
        else omit
      }}
    csr_content: "{{ pki_server_csr.csr }}"
    provider: ownca
    ownca_path: "{{ pki_local_ca_certificate_path }}"
    ownca_privatekey_path: "{{ pki_local_ca_private_key_path }}"
    ownca_privatekey_passphrase: "{{ vault_pki_ca_passphrase }}"
    ownca_not_before: "-1d"
    ownca_not_after: "{{ pki_server_validity }}"
    ignore_timestamps: true
  delegate_to: localhost
  become: false
  register: pki_signed_server_certificate
  no_log: true

- name: Installer le certificat signé
  ansible.builtin.copy:
    content: "{{ pki_signed_server_certificate.certificate }}"
    dest: "{{ pki_server_certificate_path }}"
    owner: root
    group: root
    mode: "0644"
  when: pki_signed_server_certificate is changed

- name: Installer le certificat public de la CA
  ansible.builtin.copy:
    src: "{{ pki_local_ca_certificate_path }}"
    dest: "{{ pki_server_ca_certificate_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Vérifier la chaîne de certification
  ansible.builtin.command:
    argv:
      - openssl
      - verify
      - -CAfile
      - "{{ pki_server_ca_certificate_path }}"
      - "{{ pki_server_certificate_path }}"
  changed_when: false

- name: Vérifier les noms DNS du certificat
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ pki_server_certificate_path }}"
      - -noout
      - -checkhost
      - "{{ item }}"
  loop: "{{ pki_server_verify_names }}"
  changed_when: false

- name: Vérifier l'adresse IP du certificat
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ pki_server_certificate_path }}"
      - -noout
      - -checkip
      - "{{ ansible_host }}"
  changed_when: false
