---
docker_apt_architecture: amd64

docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - podman-docker
  - containerd
  - runc

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_daemon_config:
  live-restore: true
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "5"

# Utilisateurs autorisés à administrer Docker sans sudo.
# À surcharger dans group_vars/docker_hosts.
docker_admin_users: []
