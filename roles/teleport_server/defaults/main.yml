---
teleport_version: "18.9.2"

teleport_cluster_name: "teleport.edusmart.lan"
teleport_public_addr: "teleport.edusmart.lan:443"

teleport_data_dir: "/var/lib/teleport"
teleport_config_path: "/etc/teleport.yaml"

teleport_web_listen_addr: "0.0.0.0:443"
teleport_auth_listen_addr: "0.0.0.0:3025"

teleport_enable_ssh_service: false

teleport_tls_cert_file: "/var/lib/teleport/fullchain.pem"
teleport_tls_key_file: "/var/lib/teleport/privkey.pem"
