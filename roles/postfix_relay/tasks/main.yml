---
- name: Vérifier les identifiants du smarthost
  ansible.builtin.assert:
    that:
      - vault_postfix_smtp_username is defined
      - vault_postfix_smtp_username | length > 5
      - vault_postfix_smtp_app_password is defined
      - vault_postfix_smtp_app_password | replace(' ', '') | length >= 16
      - postfix_relayhost == "smtp.gmail.com"
      - postfix_relayport | int == 587
    fail_msg: "Les paramètres du smarthost Gmail sont incomplets."
  no_log: true

- name: Préconfigurer le type d'installation Postfix
  ansible.builtin.debconf:
    name: postfix
    question: postfix/main_mailer_type
    value: "Satellite system"
    vtype: select

- name: Préconfigurer le nom de courrier Postfix
  ansible.builtin.debconf:
    name: postfix
    question: postfix/mailname
    value: "{{ postfix_mydomain }}"
    vtype: string

- name: Installer Postfix et les dépendances SMTP
  ansible.builtin.apt:
    name:
      - postfix
      - mailutils
      - swaks
      - libsasl2-modules
      - ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Déployer les identifiants SASL du smarthost
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl_passwd
    owner: root
    group: root
    mode: "0600"
  register: postfix_sasl_credentials
  no_log: true
  notify: Redémarrer Postfix

- name: Générer la table SASL Postfix
  ansible.builtin.command:
    cmd: postmap /etc/postfix/sasl_passwd
  when: postfix_sasl_credentials.changed
  no_log: true
  notify: Redémarrer Postfix

- name: Protéger la base SASL générée
  ansible.builtin.file:
    path: /etc/postfix/sasl_passwd.db
    owner: root
    group: root
    mode: "0600"

- name: Déployer la configuration Postfix
  ansible.builtin.template:
    src: main.cf.j2
    dest: /etc/postfix/main.cf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Redémarrer Postfix

- name: Déployer les alias Postfix
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  register: postfix_aliases

- name: Générer la base des alias
  ansible.builtin.command:
    cmd: newaliases
  when: postfix_aliases.changed

- name: Vérifier la configuration Postfix
  ansible.builtin.command:
    cmd: postfix check
  changed_when: false

- name: Activer et démarrer Postfix
  ansible.builtin.systemd_service:
    name: postfix
    enabled: true
    state: started

- name: Appliquer immédiatement les handlers
  ansible.builtin.meta: flush_handlers

- name: Attendre l'ouverture du port SMTP
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 25
    timeout: 30

- name: Vérifier la connectivité avec Gmail
  ansible.builtin.wait_for:
    host: "{{ postfix_relayhost }}"
    port: "{{ postfix_relayport }}"
    connect_timeout: 5
    timeout: 10
    state: started

- name: Afficher la configuration principale
  ansible.builtin.debug:
    msg:
      - "Hostname : {{ postfix_myhostname }}"
      - "Smarthost : [{{ postfix_relayhost }}]:{{ postfix_relayport }}"
      - "Clients autorisés : {{ postfix_mynetworks | join(', ') }}"
